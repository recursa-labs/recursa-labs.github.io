<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Two places to look for reusable knowledge</title>
<desc id="desc">Chosen: games A, B, and C inform one shared skill, with regression checks at batch boundaries. Discarded: independent skills for each game must all reach the threshold before consolidation and evaluation of shared guidance.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#627b4e" stroke-width="1.2"/></marker></defs>
<rect width="800" height="560" fill="#fafaf7"/>
<g font-family="Inter, Arial, sans-serif" fill="#20251f">
<text x="32" y="40" font-size="21" font-weight="600">When does experience become shared guidance?</text>
<path d="M400 74V520" stroke="#d0d5c9"/>
<text x="32" y="93" font-size="14" fill="#627b4e" letter-spacing="1">01 / CHOSEN</text>
<text x="432" y="93" font-size="14" fill="#4b5347" letter-spacing="1">02 / DISCARDED</text>
<text x="32" y="127" font-size="23" font-weight="500">Learn across a batch</text>
<text x="432" y="127" font-size="23" font-weight="500">Learn separately</text>
<g fill="#edf1e7" stroke="#627b4e">
<rect x="32" y="162" width="92" height="50" rx="6"/><rect x="148" y="162" width="92" height="50" rx="6"/><rect x="264" y="162" width="92" height="50" rx="6"/>
</g>
<g fill="#fafaf7" stroke="#a4af98">
<rect x="432" y="162" width="92" height="50" rx="6"/><rect x="548" y="162" width="92" height="50" rx="6"/><rect x="664" y="162" width="104" height="50" rx="6"/>
</g>
<g font-size="18" text-anchor="middle"><text x="78" y="193">Game A</text><text x="194" y="193">Game B</text><text x="310" y="193">Game C</text><text x="478" y="193">Game A</text><text x="594" y="193">Game B</text><text x="716" y="193">Game C</text></g>
<g fill="none" stroke="#627b4e" stroke-width="1.5" marker-end="url(#arrow)"><path d="M78 212V239L170 280"/><path d="M194 212V280"/><path d="M310 212V239L218 280"/><path d="M194 340V350 M194 378V392"/><path d="M478 212V250"/><path d="M594 212V250"/><path d="M716 212V250"/><path d="M478 300V330H594V342 M594 372V382"/><path d="M594 300V330"/><path d="M716 300V330H594"/><path d="M594 434V472"/></g>
<rect x="74" y="282" width="240" height="58" rx="6" fill="#e4ebda" stroke="#627b4e"/>
<text x="194" y="318" font-size="21" text-anchor="middle">Revise shared skill</text>
<g fill="#fafaf7" stroke="#a4af98"><rect x="432" y="252" width="92" height="48" rx="6"/><rect x="548" y="252" width="92" height="48" rx="6"/><rect x="664" y="252" width="104" height="48" rx="6"/></g>
<g font-size="18" text-anchor="middle"><text x="478" y="282">Skill A</text><text x="594" y="282">Skill B</text><text x="716" y="282">Skill C</text></g>
<text x="32" y="369" font-size="16" fill="#4b5347">Reconcile evidence as the skill evolves</text>
<text x="432" y="362" font-size="16" fill="#4b5347">Wait for every local success threshold</text>
<rect x="54" y="394" width="280" height="62" rx="6" fill="#fafaf7" stroke="#627b4e"/>
<text x="194" y="420" font-size="19" text-anchor="middle">Regression checks</text><text x="194" y="443" font-size="16" text-anchor="middle" fill="#4b5347">at batch boundaries</text>
<rect x="468" y="384" width="252" height="50" rx="6" fill="#f0f1ed" stroke="#a4af98"/><text x="594" y="415" font-size="21" text-anchor="middle">Consolidate skills</text>
<text x="194" y="500" font-size="17" text-anchor="middle" fill="#627b4e">Carry shared guidance forward</text>
<text x="594" y="498" font-size="17" text-anchor="middle" fill="#4b5347">Evaluate shared guidance alone</text>
</g></svg>
