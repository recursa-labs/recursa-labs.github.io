<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Three levels of learning</title>
<desc id="desc">Nested feedback loops distinguish task beliefs, learning methods, and review methods. Evidence can revise each, but the changes are different.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#627b4e" stroke-width="1.3"/></marker></defs>
<rect width="800" height="500" fill="#fafaf7"/>
<g font-family="system-ui, sans-serif" fill="#20251f">
<rect x="28" y="24" width="744" height="448" rx="18" fill="#edf0e7" stroke="#627b4e" stroke-width="2"/>
<text x="52" y="62" font-size="24" font-weight="650">Improve the review method</text>
<text x="52" y="94" font-size="20">When should we change how we learn?</text>
<path d="M710 55 Q744 55 744 90 L744 410 Q744 441 709 441" fill="none" stroke="#627b4e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="52" y="121" width="652" height="288" rx="14" fill="#f5f6ef" stroke="#627b4e" stroke-width="1.5"/>
<text x="76" y="158" font-size="24" font-weight="650">Improve the learning method</text>
<text x="76" y="190" font-size="20">Which experiment would reduce uncertainty?</text>
<path d="M646 148 Q678 148 678 180 L678 351 Q678 380 646 380" fill="none" stroke="#627b4e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="76" y="218" width="562" height="130" rx="12" fill="#fafaf7" stroke="#627b4e" stroke-width="1.5"/>
<text x="98" y="252" font-size="24" font-weight="650">Update task beliefs</text>
<text x="98" y="288" font-size="20">Predict</text><text x="282" y="288" font-size="20">Act</text><text x="426" y="288" font-size="20">Observe</text>
<g fill="none" stroke="#627b4e" stroke-width="2.5" marker-end="url(#arrow)"><path d="M175 281H258"/><path d="M322 281H405"/><path d="M512 285Q592 285 592 314H130Q105 314 105 303"/></g>
<text x="76" y="383" font-size="19">Repeated ambiguity → revise the investigation</text>
<text x="52" y="446" font-size="19">Poor revisions → reconsider how changes are judged</text>
</g>
</svg>
